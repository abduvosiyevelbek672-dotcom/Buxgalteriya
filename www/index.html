<style>
/* Layout: sticky control bar over one working panel; ledger-style rows with mono account codes */
:root{

}

  --bg:#0f161d;--panel:#18222c;--ink:#e6edf3;--muted:#93a2b0;--line:#2b3946;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-block:16px 48px;

.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.875rem;margin:2px 0 0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}

.code{font-family:var(--mono);font-weight:600;letter-spacing:.02em}
.tag{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
/* list */
.group{padding:0;overflow:hidden}
.grow{display:grid;grid-template-columns:4.2ch 1fr auto;gap:0 14px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;min-width:0}
.grow:first-child{border-top:0}
.grow.main{background:var(--accent-soft);font-weight:600}
.grow.sub .code{color:var(--muted)}
.grow .nm{min-width:0;overflow-wrap:anywhere}
.hid{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.chapter{font-weight:600;margin:10px 2px 0;font-size:.95rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px}

.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}

.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:24px 16px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px}
.flash .big{font-family:var(--mono);font-size:2.6rem;font-weight:600}
.flash .txt{font-size:1.3rem;font-weight:500;text-wrap:balance;overflow-wrap:anywhere}
.flash .hint{color:var(--muted);font-size:.8125rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.q{font-size:1.15rem;font-weight:500;text-wrap:balance;overflow-wrap:anywhere}
.q .code{font-size:2rem;display:block}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;min-width:0;overflow-wrap:anywhere}

.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt .code{flex:none}
input.ans{font-family:var(--mono);font-size:1.6rem;font-weight:600;width:100%;max-width:11ch;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);letter-spacing:.1em}
input.ans.right{border-color:var(--ok)} input.ans.wrong{border-color:var(--bad)}
.msg{min-height:1.5em;font-weight:500}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.score{font-family:var(--mono);font-size:2.4rem;font-weight:600}
.rev{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.9rem}
.rev div{display:flex;gap:10px}
@media (max-width:480px){.flash .big{font-size:2.2rem}.grow{grid-template-columns:4.2ch 1fr;}.grow .tag{display:none}}

  $('#sc-lat').setAttribute('aria-pressed',!S.cyr);$('#sc-cyr').setAttribute('aria-pressed',S.cyr);
  $('#lv-main').setAttribute('aria-pressed',!S.all);$('#lv-all').setAttribute('aria-pressed',S.all);
  $('#wk-off').setAttribute('aria-pressed',!S.weak);$('#wk-on').setAttribute('aria-pressed',S.weak);
  const n=pool().length,w=DATA.filter(d=>isWeak(d.c)).length;
  $('#count').textContent=`Tanlangan: ${n} ta hisob`+(w?` · qiyinlar: ${w} ta`:'');
}

/* ---------- list ---------- */
function viewList(){
  const p=pool();
  if(!p.length)return `<div class="card">Tanlangan hisob yo'q. Bo'limlarni yoki "Hammasi" filtrini tanlang.</div>`;
  let h=`<div class="tools"><span class="count">Yodlash uchun yashiring, qatorni bosib oching:</span>
    <button class="btn" id="hn">${S.hideName?'Nomlarni ko\'rsat':'Nomlarni yashir'}</button>
    <button class="btn" id="hc">${S.hideCode?'Raqamlarni ko\'rsat':'Raqamlarni yashir'}</button></div>`;
  CH.forEach(c=>{
    const items=p.filter(d=>c.f(d));if(!items.length)return;
    h+=`<div class="chapter">${S.cyr?c.k:c.n}</div><div class="card group">`;
    h+=items.map(d=>`<button class="grow ${isMain(d)?'main':'sub'}" data-c="${d.c}">
      <span class="code ${S.hideCode?'hid':''}">${d.c}</span>
      <span class="nm ${S.hideName?'hid':''}">${esc(nm(d))}</span>${tagOf(d)}</button>`).join('');
    h+=`</div>`;
  });
  return h;
}
function bindList(){
  $('#hn')?.addEventListener('click',()=>{S.hideName=!S.hideName;render()});
  $('#hc')?.addEventListener('click',()=>{S.hideCode=!S.hideCode;render()});
  document.querySelectorAll('.grow').forEach(b=>b.addEventListener('click',()=>b.querySelectorAll('.hid').forEach(e=>e.classList.remove('hid'))));
}

/* ---------- flashcards ---------- */
let F={deck:[],i:0,flip:false,known:0,front:'code'};
function startFlash(){F.deck=shuffle(pool());F.i=0;F.flip=false;F.known=0}
function viewFlash(){
  const dirs=`<div class="tools"><div class="seg"><button data-fr="code" aria-pressed="${F.front==='code'}">Raqam → nom</button><button data-fr="name" aria-pressed="${F.front==='name'}">Nom → raqam</button></div></div>`;
  if(!F.deck.length)return dirs+`<div class="card">Tanlangan hisob yo'q.</div>`;
  if(F.i>=F.deck.length)return dirs+`<div class="card" style="text-align:center"><div class="score">${F.known}/${F.deck.length}</div><p>Bilganlaringiz soni. Qolganlari "qiyinlar" ro'yxatiga qo'shildi.</p><button class="btn primary" id="fr">Qaytadan</button></div>`;
  const d=F.deck[F.i];
  const front=F.front==='code'?`<div class="big">${d.c}</div>`:`<div class="txt">${esc(nm(d))}</div>`;
  const back=F.front==='code'?`<div class="txt">${esc(nm(d))}</div>`:`<div class="big">${d.c}</div>`;
  return dirs+`<div class="bar"><i style="width:${F.i/F.deck.length*100}%"></i></div>
   <button class="flash" id="fc" aria-label="Kartochkani aylantirish">${front}${F.flip?`<hr style="width:60%;border:0;border-top:1px solid var(--line)">${back}<div>${tagOf(d)}</div>`:'<div class="hint">Javobni ko\'rish uchun bosing</div>'}</button>
   <div class="tools" style="justify-content:center">${F.flip?`<button class="btn bad" id="fno">Bilmadim</button><button class="btn ok" id="fyes">Bildim</button>`:`<button class="btn primary" id="fshow">Javobni ko'rsat</button>`}</div>
   <div class="count" style="text-align:center">${F.i+1} / ${F.deck.length}</div>`;
}
function bindFlash(){
  document.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{F.front=b.dataset.fr;render()});
  const flip=()=>{F.flip=true;render()};
  $('#fc')&&($('#fc').onclick=()=>{F.flip=!F.flip;render()});
  $('#fshow')&&($('#fshow').onclick=flip);
  const nxt=ok=>{const d=F.deck[F.i];mark(d.c,ok);if(ok)F.known++;F.i++;F.flip=false;render()};
  $('#fyes')&&($('#fyes').onclick=()=>nxt(true));
  $('#fno')&&($('#fno').onclick=()=>nxt(false));
  $('#fr')&&($('#fr').onclick=()=>{startFlash();render()});
}

/* ---------- test ---------- */
let T={qs:[],i:0,score:0,picked:null,wrong:[]};
function startTest(){
  const p=pool();
  const sel=shuffle(p).slice(0,Math.min(S.qn,p.length));
  T={qs:sel.map(d=>{
    const dir=S.dir==='mix'?(Math.random()<.5?'c2n':'n2c'):S.dir;
    const near=shuffle(DATA.filter(x=>x.c!==d.c&&(S.all||isMain(x))&&x.c.length===d.c.length&&x.c[0]===d.c[0]));
    const far=shuffle(DATA.filter(x=>x.c!==d.c&&(S.all||isMain(x))));
    const wr=[...near,...far].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
    return{d,dir,opts:shuffle([d,...wr])};
  }),i:0,score:0,picked:null,wrong:[]};
}
function viewTest(){
  const p=pool();
  const cfg=`<div class="tools"><div class="seg"><button data-td="mix" aria-pressed="${S.dir==='mix'}">Aralash</button><button data-td="c2n" aria-pressed="${S.dir==='c2n'}">Raqam → nom</button><button data-td="n2c" aria-pressed="${S.dir==='n2c'}">Nom → raqam</button></div>
   <div class="seg">${[10,20,30].map(n=>`<button data-tn="${n}" aria-pressed="${S.qn===n}">${n} ta</button>`).join('')}</div></div>`;
  if(p.length<4)return cfg+`<div class="card">Test uchun kamida 4 ta hisob tanlang.</div>`;
  if(!T.qs.length)startTest();
  if(T.i>=T.qs.length){
    const pc=Math.round(T.score/T.qs.length*100);
    return cfg+`<div class="card" style="text-align:center"><div class="score">${T.score}/${T.qs.length}</div><p>${pc}% to'g'ri</p>
      ${T.wrong.length?`<div class="rev" style="text-align:left"><div class="lbl">Xato qilganlaringiz</div>${T.wrong.map(d=>`<div><span class="code">${d.c}</span><span>${esc(nm(d))}</span></div>`).join('')}</div>`:'<p>Hammasi to\'g\'ri!</p>'}
      <p><button class="btn primary" id="tr">Yangi test</button></p></div>`;
  }
  const q=T.qs[T.i],d=q.d;
  const ques=q.dir==='c2n'?`<span class="code">${d.c}</span> qaysi hisob?`:`${esc(nm(d))} <span class="count" style="display:block">raqamini toping</span>`;
  const opts=q.opts.map((o,k)=>{
    let cl='opt';if(T.picked!==null){if(o.c===d.c)cl+=' right';else if(o.c===T.picked)cl+=' wrong'}
    const lbl=q.dir==='c2n'?esc(nm(o)):`<span class="code">${o.c}</span>`;
    return `<button class="${cl}" data-o="${o.c}" ${T.picked!==null?'disabled':''}>${lbl}</button>`}).join('');
  return cfg+`<div class="bar"><i style="width:${T.i/T.qs.length*100}%"></i></div><div class="card"><div class="q">${ques}</div><div class="opts">${opts}</div>
    ${T.picked!==null?`<p class="msg ${T.picked===d.c?'ok':'bad'}">${T.picked===d.c?'To\'g\'ri':'Noto\'g\'ri'}: <span class="code">${d.c}</span> ${esc(nm(d))} ${tagOf(d)}</p><button class="btn primary" id="tnext">${T.i+1<T.qs.length?'Keyingisi':'Natija'}</button>`:''}
    </div><div class="count" style="text-align:center">${T.i+1} / ${T.qs.length}</div>`;
}
function bindTest(){
  document.querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>{S.dir=b.dataset.td;save();T.qs=[];render()});
  document.querySelectorAll('[data-tn]').forEach(b=>b.onclick=()=>{S.qn=+b.dataset.tn;save();T.qs=[];render()});
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const d=T.qs[T.i].d;T.picked=b.dataset.o;const ok=T.picked===d.c;mark(d.c,ok);
    if(ok)T.score++;else T.wrong.push(d);render();$('#tnext')?.focus()});
  $('#tnext')&&($('#tnext').onclick=()=>{T.i++;T.picked=null;render()});
  $('#tr')&&($('#tr').onclick=()=>{T.qs=[];render()});
}

/* ---------- write ---------- */
let W={deck:[],i:0,res:null,score:0};
function startWrite(){W={deck:shuffle(pool()),i:0,res:null,score:0}}
function viewWrite(){
  if(!W.deck.length)return `<div class="card">Tanlangan hisob yo'q.</div>`;
  if(W.i>=W.deck.length)return `<div class="card" style="text-align:center"><div class="score">${W.score}/${W.deck.length}</div><p>To'g'ri yozilgan raqamlar.</p><button class="btn primary" id="wr">Qaytadan</button></div>`;
  const d=W.deck[W.i];
  return `<div class="bar"><i style="width:${W.i/W.deck.length*100}%"></i></div><div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="lbl" style="margin:0">Hisob raqamini yozing</div>
    <div class="q">${esc(nm(d))}</div>
    <form id="wf" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input class="ans ${W.res===null?'':W.res?'right':'wrong'}" id="wi" inputmode="numeric" autocomplete="off" maxlength="4" ${W.res!==null?'readonly':''} aria-label="Hisob raqami">
      <button class="btn primary" id="wb" type="submit">${W.res===null?'Tekshir':'Keyingisi'}</button>
    </form>
    <div class="msg ${W.res===null?'':W.res?'ok':'bad'}">${W.res===null?'':W.res?'To\'g\'ri':`Javob: <span class="code">${d.c}</span>`} ${W.res===null?'':tagOf(d)}</div></div>
    <div class="count" style="text-align:center">${W.i+1} / ${W.deck.length}</div>`;
}
function bindWrite(){
  const f=$('#wf');
  if(f){const inp=$('#wi');if(W.res===null)inp.focus();
    f.onsubmit=e=>{e.preventDefault();
      if(W.res!==null){W.i++;W.res=null;render();return}
      const v=inp.value.trim();if(!v)return;
      const d=W.deck[W.i];W.res=v===d.c;if(W.res)W.score++;mark(d.c,W.res);render();$('#wb').focus()}}
  $('#wr')&&($('#wr').onclick=()=>{startWrite();render()});
}

function render(){
  renderFilters();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const v={list:viewList,flash:viewFlash,test:viewTest,write:viewWrite}[S.tab]();
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">${v}</div>`;
  ({list:bindList,flash:bindFlash,test:bindTest,write:bindWrite})[S.tab]();
}
function resetModes(){F.deck=[];T.qs=[];W.deck=[];if(S.tab==='flash')startFlash();if(S.tab==='write')startWrite()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;T.qs=[];if(S.tab==='flash')startFlash();if(S.tab==='write')startWrite();render()});
$('#chapters').addEventListener('click',e=>{const b=e.target.closest('[data-ch]');if(!b)return;const id=+b.dataset.ch;
  S.ch=S.ch.includes(id)?S.ch.filter(x=>x!==id):[...S.ch,id];save();resetModes();render()});
$('#sc-lat').onclick=()=>{S.cyr=false;save();render()};
$('#sc-cyr').onclick=()=>{S.cyr=true;save();render()};
$('#lv-main').onclick=()=>{S.all=false;save();resetModes();render()};
$('#lv-all').onclick=()=>{S.all=true;save();resetModes();render()};
$('#wk-off').onclick=()=>{S.weak=false;save();resetModes();render()};
$('#wk-on').onclick=()=>{S.weak=true;save();resetModes();render()};
render();
</script>

</body></html>
